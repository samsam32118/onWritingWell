<title>Writing Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: a reading desk. Request on top, two manuscripts side by side (stacked on phones), verdict bar pinned below. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --fg: #1a1e27; --muted: #5a6273; --line: #d9dde5;
  --accent: #2b49c9; --accent-soft: #e5e9fb; --good: #1d7a4f;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141a; --surface: #191d25; --fg: #e5e8ef; --muted: #9aa2b3; --line: #2a303c;
  --accent: #8fa3ff; --accent-soft: #232b4a; --good: #5fcf98; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11141a; --surface: #191d25; --fg: #e5e8ef; --muted: #9aa2b3; --line: #2a303c;
  --accent: #8fa3ff; --accent-soft: #232b4a; --good: #5fcf98; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 140px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font: 600 20px/1.2 var(--sans); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
.count { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s }
.request { background: var(--accent-soft); border-radius: 10px; padding: 14px 18px; }
.label { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px }
.request .text { font: 16px/1.5 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start }
@media (max-width: 820px) { .pair { grid-template-columns: 1fr } }
.resp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 22px 22px; min-width: 0 }
.resp .label { display: flex; justify-content: space-between }
.prose { font: 17px/1.62 var(--serif); max-width: 68ch; overflow-wrap: anywhere }
.prose p { margin: 0 0 .85em } .prose :is(h1,h2,h3,h4) { font: 600 1.05em/1.3 var(--sans); margin: 1.1em 0 .4em }
.prose :is(ul,ol) { padding-left: 1.3em; margin: 0 0 .85em } .prose li { margin: .2em 0 }
.prose code { font: .86em var(--mono); background: var(--bg); padding: .1em .3em; border-radius: 4px }
.prose pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px }
.prose pre code { background: none; padding: 0 }
.prose blockquote { margin: 0 0 .85em; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted) }
.verdict { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.vin { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.scale button { font: 500 14px var(--sans); padding: 10px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 8px; cursor: pointer; display: grid; gap: 2px; justify-items: center }
.scale button kbd { font: 11px var(--mono); color: var(--muted) }
.scale button:hover { border-color: var(--accent) }
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.scale button[aria-pressed="true"] kbd { color: var(--surface) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.row input { flex: 1 1 260px; min-width: 0; font: 14px var(--sans); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg) }
.row button { font: 500 14px var(--sans); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer }
.row button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.row button:disabled { opacity: .45; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.status { font: 13px var(--sans); color: var(--muted) } .status.ok { color: var(--good) }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; max-width: 640px }
.empty h2 { font: 600 17px var(--sans); margin: 0 0 6px }
.empty p { margin: 0; color: var(--muted) }
@media (max-width: 520px) { .scale button { font-size: 12px; padding: 8px 2px } .prose { font-size: 16px } }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none } }
</style>

<div class="wrap">
  <header>
    <h1>Which reply is better written?</h1>
    <span class="count" id="count">loading…</span>
  </header>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>
  <main id="main">
    <div class="empty" id="empty">
      <h2>Waiting for pairs</h2>
      <p id="emptyText">Pairs of model replies appear here once Claude loads a batch. Each pair shows one request and two anonymous replies; you pick the better-written one, judging both how it sounds and whether the ideas are right.</p>
    </div>
  </main>
</div>

<div class="verdict" id="verdict" hidden>
  <div class="vin">
    <div class="scale" role="group" aria-label="Verdict">
      <button id="v1" data-v="A>>B" aria-pressed="false">A much better<kbd>1</kbd></button>
      <button id="v2" data-v="A>B" aria-pressed="false">A better<kbd>2</kbd></button>
      <button id="v3" data-v="A=B" aria-pressed="false">Can't choose<kbd>3</kbd></button>
      <button id="v4" data-v="B>A" aria-pressed="false">B better<kbd>4</kbd></button>
      <button id="v5" data-v="B>>A" aria-pressed="false">B much better<kbd>5</kbd></button>
    </div>
    <div class="row">
      <input id="note" type="text" placeholder="Why? (optional, but it teaches the judge most)" aria-label="Reason for your verdict">
      <button id="prev">Back</button>
      <button id="next" class="primary" disabled>Save and next</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parse(String(s ?? ""), { breaks: false })) : "<p>" + esc(s).replace(/\n{2,}/g, "</p><p>") + "</p>";

let db = null, pairs = [], labels = {}, idx = 0, choice = null;

function firstOpen() { const i = pairs.findIndex(p => !labels[p.id]); return i < 0 ? pairs.length : i; }

function render() {
  const done = pairs.filter(p => labels[p.id]).length;
  $("count").textContent = pairs.length ? `${done} of ${pairs.length} labelled` : "no pairs yet";
  $("progress").style.width = pairs.length ? (100 * done / pairs.length) + "%" : "0";
  if (!pairs.length) { $("verdict").hidden = true; return; }
  if (idx >= pairs.length) {
    $("main").innerHTML = `<div class="empty"><h2>All ${pairs.length} pairs labelled</h2><p>Thank you. Claude reads these labels to check how often its judge agrees with you. Use Back to revisit any pair.</p></div>`;
    $("verdict").hidden = false; $("next").disabled = true; setChoice(null); return;
  }
  const p = pairs[idx];
  $("main").innerHTML = `
    <section class="request"><div class="label">Request · pair ${idx + 1}</div><div class="text">${esc(p.prompt)}</div></section>
    <div class="pair">
      <article class="resp"><div class="label"><span>Reply A</span><span>${wc(p.a)} words</span></div><div class="prose">${md(p.a)}</div></article>
      <article class="resp"><div class="label"><span>Reply B</span><span>${wc(p.b)} words</span></div><div class="prose">${md(p.b)}</div></article>
    </div>`;
  $("verdict").hidden = false;
  const l = labels[p.id];
  setChoice(l ? l.verdict : null);
  $("note").value = l?.note || "";
  $("prev").disabled = idx === 0;
  $("status").textContent = l ? "Saved earlier" : ""; $("status").className = "status" + (l ? " ok" : "");
}
const wc = s => String(s ?? "").split(/\s+/).filter(Boolean).length;

function setChoice(v) {
  choice = v;
  document.querySelectorAll(".scale button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  $("next").disabled = !v || idx >= pairs.length;
}

async function save() {
  if (!choice || idx >= pairs.length) return;
  const p = pairs[idx];
  const rec = { verdict: choice, note: $("note").value.trim(), pair: p.id, at: new Date().toISOString() };
  $("next").disabled = true; $("status").textContent = "Saving…"; $("status").className = "status";
  try {
    if (db) await db.collection("labels").doc(p.id).set(rec);
    labels[p.id] = rec;
    idx = Math.min(idx + 1, pairs.length);
    while (idx < pairs.length && labels[pairs[idx].id]) idx++;
    render(); window.scrollTo({ top: 0 });
  } catch (e) {
    $("status").textContent = e?.code === "not_granted" ? "You can view this page but not save labels." : "Could not save. Check your connection and press Save again.";
    $("next").disabled = false;
  }
}

document.querySelectorAll(".scale button").forEach(b => b.addEventListener("click", () => setChoice(b.dataset.v)));
$("next").addEventListener("click", save);
$("prev").addEventListener("click", () => { if (idx > 0) { idx--; render(); } });
document.addEventListener("keydown", e => {
  if (e.target === $("note")) { if (e.key === "Enter") save(); return; }
  const n = Number(e.key);
  if (n >= 1 && n <= 5) setChoice($("v" + n).dataset.v);
  if (e.key === "Enter") save();
});

(async () => {
  const timer = setTimeout(() => { if (!pairs.length) $("emptyText").textContent = "The label store did not answer. Reload the page to try again."; }, 10000);
  db = await window.claude?.use?.("db");
  if (!db) { clearTimeout(timer); $("count").textContent = "read-only"; $("emptyText").textContent = "Sign in to claude.ai to see and label pairs."; return; }
  let gotPairs = false, gotLabels = false;
  const ready = () => { if (gotPairs && gotLabels) { clearTimeout(timer); if (idx === 0 || idx >= pairs.length) idx = firstOpen(); render(); } };
  db.collection("pairs").orderBy("order").limit(1000).onSnapshot(s => {
    pairs = s.docs.map(d => ({ id: d.id, ...d.data() })); gotPairs = true; ready();
  }, () => { $("emptyText").textContent = "Could not load pairs. Reload the page to try again."; });
  db.collection("labels").limit(1000).onSnapshot(s => {
    labels = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); gotLabels = true; ready();
  }, () => { gotLabels = true; ready(); });
})();
</script>
