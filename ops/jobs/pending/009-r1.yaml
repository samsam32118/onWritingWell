# Fast-loop round 1: DPO base -> pol1 on round-0 tournament pairs, then sample pol1 on the
# 90-prompt eval, capability, and round-1 candidates (2 plain + 2 styled per prompt).
# Candidates are capped at 2048 tokens; a truncated one is rejected against the best.
id: 009-r1
steps:
  - train: {stage: dpo, model: base, data: data/rounds/r0_pairs.jsonl, out_model: pol1,
      timeout: 5400,
      hp: {epochs: 1, lr: 1.0e-5, beta: 0.1, rpo_alpha: 0.2, lora_r: 64, lora_alpha: 64,
        grad_accum: 8, max_length: 6144}}
  - generate:
      model: pol1
      timeout: 3600
      runs:
        - {prompts: data/prompts/eval_fast.jsonl, tag: pol1, out: eval_pol1.jsonl}
        - {prompts: data/eval/capability_prompts.jsonl, tag: pol1, out: cap_pol1.jsonl, temperature: 0.2}
        - {prompts: data/prompts/train_r1.jsonl, tag: pol1, out: r1_plain.jsonl, n: 2, temperature: 0.8, max_tokens: 2048}
        - {prompts: data/prompts/train_r1.jsonl, tag: pol1s, out: r1_styled.jsonl, n: 2, temperature: 0.8, max_tokens: 2048, system: configs/style_system_prompt.txt}
