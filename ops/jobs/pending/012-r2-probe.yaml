# Sampling only, no training: tests explanations before round 3.
# 1 vs 2: does pol2 + style prompt beat base + style prompt (eval_base_styled)? ~0.50
#   means the loop only distills the prompt; >0.55 means selection adds quality.
# 3: do human essays still beat pol2 (~0.89 vs base)? If so, the pair judge is the limit.
# Predicted before running: pol2s vs styled ~0.50; human vs pol2 ~0.85.
id: 012-r2-probe
gpu: H200
steps:
  - generate:
      model: pol2
      timeout: 2400
      runs:
        - {prompts: data/prompts/eval_fast.jsonl, tag: pol2s, out: eval_pol2_styled.jsonl,
            system: configs/style_system_prompt.txt}
        - {prompts: data/eval/human_ref_prompts.jsonl, tag: pol2, out: href_pol2.jsonl}
        - {prompts: data/eval/human_ref_prompts.jsonl, tag: pol2s, out: href_pol2_styled.jsonl,
            system: configs/style_system_prompt.txt}
