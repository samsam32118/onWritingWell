# Fast-loop round 3 (last planned): DPO pol2 -> pol3 on round-2 pairs, then sample the full
# 180-prompt eval and capability set for the final comparison against base, styled base
# and earlier rounds. No further candidates are sampled.
id: 011-r3
steps:
  - train: {stage: dpo, model: pol2, data: data/rounds/r2_pairs.jsonl, out_model: pol3,
      timeout: 5400,
      hp: {epochs: 1, lr: 2.0e-5, beta: 0.1, rpo_alpha: 0.2, lora_r: 64, lora_alpha: 64,
        grad_accum: 8, max_length: 6144}}
  - generate:
      model: pol3
      timeout: 2400
      runs:
        - {prompts: data/prompts/eval.jsonl, tag: pol3, out: eval_pol3.jsonl}
        - {prompts: data/eval/capability_prompts.jsonl, tag: pol3, out: cap_pol3.jsonl, temperature: 0.2}
