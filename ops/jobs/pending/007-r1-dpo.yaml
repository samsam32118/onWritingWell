# Online round 1: DPO from dpo1 on tournament pairs (Sonnet judges, round robin among 3 dpo1
# samples + 1 styled-base sample per prompt; best vs worst with margin >= 0.34; truncated
# samples are rejected against the best). Pairs hold model text only, so they are in the repo.
# On-policy pairs are closer in quality than human-vs-base, so lr is halved from 005.
# Samples dpo2 on eval/capability and round-2 candidates in the same job.
id: 007-r1-dpo
steps:
  - train: {stage: dpo, model: dpo1, data: data/rounds/r1_pairs.jsonl, out_model: dpo2,
      timeout: 10800,
      hp: {epochs: 1, lr: 1.0e-5, beta: 0.1, rpo_alpha: 0.2, lora_r: 64, lora_alpha: 64,
        grad_accum: 16, max_length: 6144}}
  - generate:
      model: dpo2
      timeout: 6000
      runs:
        - {prompts: data/prompts/eval.jsonl, tag: dpo2, out: eval_dpo2.jsonl}
        - {prompts: data/eval/human_ref_prompts.jsonl, tag: dpo2, out: href_dpo2.jsonl}
        - {prompts: data/eval/capability_prompts.jsonl, tag: dpo2, out: cap_dpo2.jsonl, temperature: 0.2}
        - {prompts: data/prompts/train.jsonl, tag: dpo2, out: r2_samples.jsonl, n: 4, temperature: 0.9}
