# Offline DPO: chosen = human text, rejected = the base model's answer to the same request
# (sampled in 002 and kept on the volume). Starts from the SFT model, so the reference is
# sft1 and the update moves away from the default assistant voice rather than re-learning
# imitation. Then samples eval + capability prompts and the round-1 candidates
# (1,200 training prompts x 4) from the new policy in one model load.
id: 003-dpo1
steps:
  - build_human_pairs: {sft: vol:data/sft1.jsonl, samples: vol:data/base_on_sft_prompts.jsonl,
      out: human_pairs1.jsonl}
  - train: {stage: dpo, model: sft1, data: vol:data/human_pairs1.jsonl, out_model: dpo1,
      timeout: 18000,
      hp: {epochs: 1, lr: 2.0e-5, beta: 0.1, rpo_alpha: 0.2, lora_r: 64, lora_alpha: 64,
        grad_accum: 16, max_length: 6144}}
  - generate:
      model: dpo1
      timeout: 7200
      runs:
        - {prompts: data/prompts/eval.jsonl, tag: dpo1, out: eval_dpo1.jsonl}
        - {prompts: data/eval/human_ref_prompts.jsonl, tag: dpo1, out: href_dpo1.jsonl}
        - {prompts: data/eval/capability_prompts.jsonl, tag: dpo1, out: cap_dpo1.jsonl, temperature: 0.2}
        - {prompts: data/prompts/train.jsonl, tag: dpo1, out: r1_samples.jsonl, n: 4, temperature: 0.9}
