# Fast loop, restarted from base. sft1/sft2/dpo1 learned the blog surface but lost the
# reasoning in long answers (dpo1: 0.30 vs base, 0.25 vs styled base under Opus), while base
# with the style system prompt beats base 0.64 and keeps its substance. Each round:
#   400 prompts x (2 plain + 2 styled samples from the current policy) -> Sonnet round robin
#   -> DPO on (best, worst) without the system prompt -> one job trains, merges, and samples
#   the next round + a 90-prompt eval. ~$5-6 of GPU and ~1 h per round.
# Round 0 needs only the plain base samples: the styled ones are in 005b (r1_styled.jsonl).
id: 008-r0-sample
steps:
  - generate:
      model: base
      timeout: 2400
      runs:
        - {prompts: data/prompts/train_r0.jsonl, tag: base, out: r0_plain.jsonl, n: 2, temperature: 0.8, max_tokens: 2048}
