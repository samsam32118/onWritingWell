# Probe 2 (about $1): corpus rebuilt with extraction libraries pinned to the local versions
# (probe 1 lost 816 docs to hash mismatches), then 8 steps at 4 sequences per step with the
# causal-conv1d kernel and per-step timing. No merge. Capped at 30 minutes.
id: 002b-sft-probe
steps:
  - build_corpus: {}
  - build_sft: {holdout: data/holdout.json, out: sft1.jsonl}
  - train: {stage: sft, model: base, data: vol:data/sft1.jsonl, out_model: probe2, merge: false,
      timeout: 1800, hp: {max_steps: 8, batch_size: 4, grad_accum: 4, lr: 1.0e-4, lora_r: 64,
      lora_alpha: 64, max_length: 6144, logging_steps: 1}}
