# Sample dpo1 on eval, held-out essay and capability prompts only: its DPO curve saturated
# (margins in the hundreds, chosen logp falling), so check it before spending on round-1
# candidates. In parallel, base with the style system prompt
# (beats plain base 0.64 under Opus) adds 2 candidates per prompt, so where the policy's
# essays are hollow the tournament can still choose a substantive answer. The prompt is not
# part of training: DPO sees only the user request.
id: 005b-dpo1-sample
steps:
  - - generate:
        model: dpo1
        timeout: 3000
        runs:
          - {prompts: data/prompts/eval.jsonl, tag: dpo1, out: eval_dpo1.jsonl}
          - {prompts: data/eval/human_ref_prompts.jsonl, tag: dpo1, out: href_dpo1.jsonl}
          - {prompts: data/eval/capability_prompts.jsonl, tag: dpo1, out: cap_dpo1.jsonl, temperature: 0.2}
    - generate:
        model: base
        timeout: 3600
        runs:
          - {prompts: data/prompts/train.jsonl, tag: styled, out: r1_styled.jsonl, n: 2, temperature: 0.8, system: configs/style_system_prompt.txt}
